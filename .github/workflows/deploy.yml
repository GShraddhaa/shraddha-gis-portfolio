name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: bun run build

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf gh-pages-artifact
          mkdir -p gh-pages-artifact
          cp -a dist/client/. gh-pages-artifact/
          if [ -f gh-pages-artifact/shraddha-gis-portfolio/index.html ] && [ ! -f gh-pages-artifact/index.html ]; then
            cp -a gh-pages-artifact/shraddha-gis-portfolio/. gh-pages-artifact/
          fi
          touch gh-pages-artifact/.nojekyll
          cp gh-pages-artifact/index.html gh-pages-artifact/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
